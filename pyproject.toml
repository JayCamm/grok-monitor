[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-monitor"
version = "0.1.0"
description = "Early-warning instruments for grokking runs: kill rules and precursor detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]
authors = [{name = "JayCamm"}]

[project.urls]
Homepage = "https://github.com/JayCamm/grok-monitor"

[tool.setuptools.packages.find]
where = ["."]
include = ["grok_monitor*"]
